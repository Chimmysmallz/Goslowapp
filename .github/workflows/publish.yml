# Publishes the web/ folder to GitHub Pages every time you push to the main branch.
# One-time setup: on GitHub, go to Settings -> Pages -> Source and choose "GitHub Actions".
# If the story check finds an error, the publish stops and your live game is NOT replaced,
# so players never get a broken version. Open the "Actions" tab on GitHub to see why.
name: Publish game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the story for broken links
        run: node tools/check_story.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
